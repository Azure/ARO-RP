# Fake/synthetic gateway OTEL collector config for e2e integration testing.
# Receives OTLP from cluster exporters and appends log records to a file for
# assertion. No gatewayauth/TLS (Tier A).
#
# Run (from repo root):
#   go run ./hack/otele2e
# (builds telemetrycollector via make if the binary is missing)
#
# Flags: -config, -logfile, -binary, -health, -ready-timeout
# Received logs default to _out/otel-e2e/logs.json
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  file:
    path: ${env:OTEL_E2E_LOG_FILE}
    format: json
    append: true
    create_directory: true
    flush_interval: 1s

service:
  telemetry:
    metrics:
      level: none
  extensions:
    - health_check
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file]
