# Fake/synthetic gateway OTEL collector config for e2e integration testing.
# Receives OTLP from cluster exporters and prints records via the debug exporter
# (Tier A: no gatewayauth/TLS). Intended to run as ACI with VNet injection.
#
# Received logs get attribute aro.e2e.otel="[ARO-E2E-OTEL]" so container logs
# can be filtered with that marker (debug exporter dumps attributes).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  attributes/e2e-sink:
    actions:
      - key: aro.e2e.otel
        value: "[ARO-E2E-OTEL]"
        action: insert

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      level: none
  extensions:
    - health_check
  pipelines:
    logs:
      receivers: [otlp]
      processors: [attributes/e2e-sink]
      exporters: [debug]
